appId: com.privvy.app
name: PIN setup, unlock, and session notification
tags:
  - auth
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Privvy"
- assertVisible: "Create a PIN to protect this space"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Continue"
- assertVisible: "Confirm your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Set PIN"
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Session active"
- assertVisible: "Import APK"
- tapOn: "Lock and stop session"
- assertVisible: "Enter your PIN to unlock"
- tapOn: "9"
- tapOn: "9"
- tapOn: "9"
- tapOn: "9"
- assertVisible: "●●●●"
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Wrong PIN"
    timeout: 5000
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- assertVisible: "●●●●"
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Session active"
    timeout: 5000
