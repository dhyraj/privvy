appId: com.privvy.app
name: Guest data isolation across spaces
tags:
  - spaces
  - guest
  - isolation
  - smoke
---
- launchApp
- assertVisible: "Create a PIN to protect this space"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Continue"
- assertVisible: "Confirm your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Set PIN"
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Session active"
- tapOn: "Import test APK (debug)"
- extendedWaitUntil:
    visible: ".*Imported.*"
    timeout: 20000
- tapOn:
    id: "launch_com.privvy.guesttest"
- extendedWaitUntil:
    visible: "Hello from guest APK"
    timeout: 20000
- scrollUntilVisible:
    element: "WRITE /SDCARD TEST"
    direction: DOWN
- tapOn: "WRITE /SDCARD TEST"
- assertVisible: "(?s).*PASS: wrote /sdcard/guest-boot-test.txt.*"
- scrollUntilVisible:
    element: "TEST PREFERENCES"
    direction: DOWN
- tapOn: "TEST PREFERENCES"
- assertVisible: "(?s).*PASS prefs=true value=isolated.*"
- scrollUntilVisible:
    element: "INSERT MEDIASTORE IMAGE"
    direction: DOWN
- tapOn: "INSERT MEDIASTORE IMAGE"
- assertVisible: "(?s).*PASS MediaStore=.*"
- pressKey: BACK
- assertVisible: "Session active"
- scrollUntilVisible:
    element: "Spaces"
    direction: DOWN
- tapOn: "Spaces"
- tapOn:
    id: "create_space_button"
- tapOn:
    id: "create_space_name"
- inputText: "Work"
- pressKey: ENTER
- inputText: "5678"
- pressKey: ENTER
- inputText: "5678"
- pressKey: ENTER
- assertVisible: "Created Work"
- tapOn:
    id: "close_space_manager"
- tapOn:
    id: "space_selector"
- tapOn: "Work"
- tapOn: "5"
- tapOn: "6"
- tapOn: "7"
- tapOn: "8"
- tapOn: "Unlock"
- assertVisible: "No apps in this space yet"
- tapOn: "Import test APK (debug)"
- extendedWaitUntil:
    visible: ".*Imported.*"
    timeout: 20000
- tapOn:
    id: "launch_com.privvy.guesttest"
- extendedWaitUntil:
    visible: "Hello from guest APK"
    timeout: 20000
- scrollUntilVisible:
    element: "READ ISOLATION STATE"
    direction: DOWN
- tapOn: "READ ISOLATION STATE"
- assertVisible: "(?s).*ISOLATION prefs=missing.*sdcard=missing.*media=0.*"
- scrollUntilVisible:
    element: "WRITE /SDCARD TEST"
    direction: UP
- tapOn: "WRITE /SDCARD TEST"
- assertVisible: "(?s).*PASS: wrote /sdcard/guest-boot-test.txt.*"
- scrollUntilVisible:
    element: "TEST PREFERENCES"
    direction: DOWN
- tapOn: "TEST PREFERENCES"
- assertVisible: "(?s).*PASS prefs=true value=isolated.*"
- scrollUntilVisible:
    element: "INSERT MEDIASTORE IMAGE"
    direction: DOWN
- tapOn: "INSERT MEDIASTORE IMAGE"
- assertVisible: "(?s).*PASS MediaStore=.*"
- pressKey: BACK
- assertVisible: "Session active"
- tapOn:
    id: "space_selector"
- tapOn: "Personal"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Unlock"
- assertVisible: "Guest Test"
- tapOn:
    id: "launch_com.privvy.guesttest"
- extendedWaitUntil:
    visible: "Hello from guest APK"
    timeout: 20000
- scrollUntilVisible:
    element: "READ ISOLATION STATE"
    direction: DOWN
- tapOn: "READ ISOLATION STATE"
- assertVisible: "(?s).*ISOLATION prefs=isolated.*sdcard=guest-wrote-this.*media=1.*"
- pressKey: BACK
- assertVisible: "Session active"
