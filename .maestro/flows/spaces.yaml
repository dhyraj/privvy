appId: com.privvy.app
name: Virtual spaces lifecycle
tags:
  - spaces
  - smoke
---
- launchApp
- stopApp
- launchApp
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Unlock"
- assertVisible: "Session active"
- scrollUntilVisible:
    element: "Spaces"
    direction: DOWN
- tapOn: "Spaces"
- assertVisible: "1 isolated workspace"
- tapOn:
    id: "create_space_button"
- tapOn:
    id: "create_space_name"
- inputText: "Work"
- tapOn:
    id: "create_space_pin"
- inputText: "5678"
- tapOn:
    id: "create_space_pin_confirm"
- inputText: "5678"
- tapOn:
    id: "confirm_create_space"
- assertVisible: "Created Work"
- tapOn:
    id: "rename_space_1"
- tapOn:
    id: "rename_space_name"
- eraseText
- inputText: "Work Vault"
- tapOn:
    id: "confirm_rename_space"
- assertVisible: "Space renamed"
- tapOn:
    id: "close_space_manager"
- tapOn:
    id: "space_selector"
- tapOn: "Work Vault"
- tapOn: "5"
- tapOn: "6"
- tapOn: "7"
- tapOn: "8"
- tapOn: "Unlock"
- assertVisible: "Work Vault"
- assertVisible: "No apps in this space yet"
- tapOn: "Import test APK (debug)"
- extendedWaitUntil:
    visible: ".*Imported.*"
    timeout: 20000
- assertVisible: "Guest Test"
- scrollUntilVisible:
    element: "Spaces"
    direction: DOWN
- tapOn: "Spaces"
- tapOn:
    id: "change_pin_1"
- tapOn:
    id: "change_space_pin"
- inputText: "9999"
- tapOn:
    id: "change_space_pin_confirm"
- inputText: "9999"
- tapOn:
    id: "confirm_change_pin"
- assertVisible: "PIN updated"
- tapOn:
    id: "close_space_manager"
- tapOn:
    id: "space_selector"
- tapOn: "Personal"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Unlock"
- assertVisible: "Guest Test"
- tapOn:
    id: "space_selector"
- tapOn: "Work Vault"
- tapOn: "5"
- tapOn: "6"
- tapOn: "7"
- tapOn: "8"
- tapOn: "Unlock"
- assertVisible: "Wrong PIN"
- tapOn: "9"
- tapOn: "9"
- tapOn: "9"
- tapOn: "9"
- tapOn: "Unlock"
- assertVisible: "Work Vault"
- scrollUntilVisible:
    element: "Spaces"
    direction: DOWN
- tapOn: "Spaces"
- tapOn:
    id: "wipe_space_1"
- tapOn:
    id: "confirm_wipe_space"
- assertVisible: "Space wiped"
- tapOn:
    id: "close_space_manager"
- assertVisible: "No apps in this space yet"
- scrollUntilVisible:
    element: "Spaces"
    direction: DOWN
- tapOn: "Spaces"
- tapOn:
    id: "delete_space_1"
- tapOn:
    id: "confirm_delete_space"
- assertVisible: "Enter your PIN to unlock"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "Unlock"
- assertVisible: "Personal"
- assertVisible: "Guest Test"
